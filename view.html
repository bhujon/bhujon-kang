    <style>
        /* [스타일 복구 및 최적화] */
        body { background: #fff; }
        
        header {
            z-index: 9000 !important;
            background: #fff !important;
            border-bottom: 1px solid #eee;
        }

        .view-content-wrapper {
            padding-top: 150px; 
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 1. 최상단 Hero 이미지 */
        .view-hero-area {
            padding: 0 50px;
            margin-bottom: 10px; /* 썸네일과의 간격을 위해 마진 축소 */
            width: 100%;
        }
        .hero-unit {
            width: 100%;
            height: auto; 
            min-height: auto; 
            max-height: none; 
            overflow: hidden;
            cursor: pointer;
            background: #f9f9f9;
            position: relative;
        }
        .hero-unit img {
            width: 100%; 
            height: auto; 
            object-fit: contain; 
            display: block; 
            transition: transform 0.5s ease;
        }

        /* 2. 썸네일 그리드 (정사각형 강제) */
        .bento-grid-area {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* PC에서는 6열 */
            gap: 10px; 
            padding: 0 50px 60px; /* 텍스트와의 간격을 위해 하단 패딩 부여 */
        }
        .bento-unit { 
            overflow: hidden; 
            cursor: pointer; 
            background: #f9f9f9; 
            position: relative; 
            aspect-ratio: 1 / 1; /* 무조건 정사각형 유지 */
        }
        .bento-unit img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* 이미지가 잘리더라도 정사각형 공간을 채움 */
            display: block; 
            transition: 0.5s ease; 
        }

        /* 비디오 플레이 버튼 오버레이 */
        .video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center;
            transition: 0.3s;
        }
